# 013 (T13-A): protocolo da validação semântica dos detectores.
# Congelado em 2026-10-27, antes do sorteio da amostra principal. Mudar
# qualquer valor depois do sorteio exige nova versão da rubrica e nova
# anotação; o manifesto registra o SHA256 deste arquivo.

findings: dataset/processed/findings_v2.jsonl
sample_dir: dataset/interim/t13a
reports_dir: reports

sampling:
  seed: 20261027
  target_per_detector: 20

# Decisão por detector (013/FR-006): Wilson bilateral sobre
# n_verdadeiro / (n_verdadeiro + n_falso).
decision:
  confidence: 0.95
  cut: 0.5
  min_determined: 10
  max_indeterminate_fraction: 0.5

