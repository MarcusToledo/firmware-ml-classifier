# Rubrica v1 (013/FR-003). Classes: verdadeiro_candidato, falso_positivo,
# indeterminado. "verdadeiro candidato" não é vulnerabilidade nem CVE: a
# rubrica pergunta só se a string contém o alvo declarado do detector.
rubric:
  version: "1"
  frozen_at: "2026-10-27"
  indeterminate_reasons: [truncada, sem_contexto, ambigua, formato_desconhecido]
  # R3 (FP-ruido), exceto api_tokens; R7 (FP-exemplo), exceto urls;
  # R9 (FP-assinatura) só nos detectores do Binwalk.
  general_false_positive:
    FP-ruido: {exclude: [api_tokens]}
    FP-exemplo: {exclude: [urls]}
    FP-assinatura: {only: [crypto_signatures, encrypted_sections]}
  detectors:
    hardcoded_passwords:
      target: valor literal de credencial ou senha padrão citada como senha
      verdadeiro: [HP-1, HP-2]
      falso: [FP-chave, FP-ref, FP-codigo]
      refs: [002/FR-003]
    credential_pairs:
      target: par usuário:senha de autenticação
      verdadeiro: [CP-1]
      falso: [FP-sintaxe]
      refs: [002/FR-004]
    non_public_ips:
      target: IPv4 não global usado como endereço de rede
      verdadeiro: [NI-1]
      falso: [FP-versao, FP-oid, FP-outro]
      refs: [002/FR-005]
    public_ips:
      target: IPv4 global usado como endereço de rede
      verdadeiro: [PI-1]
      falso: [FP-versao, FP-oid, FP-outro]
      refs: [002/FR-006, 002/FR-033]
    telnetd:
      target: referência ao daemon telnet
      verdadeiro: [TD-1]
      falso: [FP-sub]
      refs: [002/FR-007]
    debug_account:
      target: acesso de depuração, teste ou convidado
      verdadeiro: [DA-1, DA-2]
      falso: [FP-log, FP-comando]
      refs: [002/FR-008, 002/FR-030]
    outdated_libssl:
      target: versão do OpenSSL embarcada abaixo de 1.1.1
      verdadeiro: [OS-1]
      falso: [FP-mencao, FP-parse]
      refs: [002/FR-009]
    outdated_busybox:
      target: versão do BusyBox embarcada abaixo de 1.33.0
      verdadeiro: [BB-1]
      falso: [FP-mencao, FP-parse]
      refs: [002/FR-009]
    urls:
      target: URL HTTP(S) como referência a recurso, inclusive template
      verdadeiro: [UR-1, UR-2]
      falso: [FP-corte]
      refs: [002/FR-010]
    api_tokens:
      target: segredo de autenticação em hex ou base64
      verdadeiro: [AT-1]
      falso: [FP-hash, FP-dado, FP-texto]
      refs: [002/FR-011, 002/FR-031]
    crypto_signatures:
      target: descrição do Binwalk de construção ou material criptográfico
      verdadeiro: [CS-1]
      falso: [FP-palavra]
      subtypes: [chave_privada, certificado, chave_publica, algoritmo_tabela]
      refs: [002/FR-012, 002/FR-032, 006/FR-016]
    encrypted_sections:
      target: descrição do Binwalk de dado cifrado
      verdadeiro: [ES-1]
      falso: [FP-algoritmo]
      refs: [002/FR-013, 006/FR-016]
