[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-ml-classifier"
version = "0.1.0"
description = "Classificação de firmware por fabricante usando ML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.4",
    "scikit-learn>=1.1",
    "gensim>=4.2",
    "tqdm>=4.64",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "pyarrow>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
extract-features = "scripts.extract_features:main"
train-doc2vec = "scripts.train_doc2vec:main"
inspect-tokens = "scripts.inspect_tokens:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipeline*", "scripts*"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
